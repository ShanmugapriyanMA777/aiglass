<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Activity Timeline - VisionAssist Guardian Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/realtime.js"></script>
</head>
<body id="activity-page">

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Guardian Portal</div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="tracking.html" class="nav-item">Live GPS Tracking</a>
        <a href="alerts.html" class="nav-item">Safety & SOS Alerts</a>
        <a href="activity.html" class="nav-item active">AI Activity & OCR</a>
        <a href="reports.html" class="nav-item">Daily Reports</a>
        <a href="settings.html" class="nav-item">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn" style="width:100%; color:white; border: 1px solid rgba(255,255,255,0.3); background: transparent;">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h2>AI Companion Activity Timeline & Event Logs</h2>
      </header>

      <div class="container">
        <div class="card col-12">
          <div class="card-header">
            <span class="card-title">Activity Filter</span>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-primary activity-filter-btn active" data-filter="ALL">All Events</button>
              <button class="btn btn-outline activity-filter-btn" data-filter="NAVIGATION">Navigation</button>
              <button class="btn btn-outline activity-filter-btn" data-filter="CURRENCY">Currency</button>
              <button class="btn btn-outline activity-filter-btn" data-filter="OCR">OCR Text</button>
              <button class="btn btn-outline activity-filter-btn" data-filter="OBJECT">Objects</button>
            </div>
          </div>

          <div id="activity-timeline-container" class="timeline" style="margin-top: 20px;"></div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
